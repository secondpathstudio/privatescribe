# electron-builder config for PrivateScribe.
#
# Assumes these have already been built:
#   - frontend/dist/        (npm run build:frontend)
#   - electron/dist/        (npm run build:electron)
#   - backend/dist/privatescribe-backend/  (npm run build:backend, slow)
#   - build-resources/ollama/  (npm run build:ollama — run automatically by `npm run dist`)
#   - build-resources/caddy/   (npm run build:caddy  — run automatically by `npm run dist`)
#
# Run: npm run dist  →  release/PrivateScribe-<ver>.dmg

appId: com.secondpath.privatescribe
productName: PrivateScribe
copyright: Copyright © 2026 Second Path Studio

directories:
  output: release

# Auto-update source. electron-builder publishes the installer, the update
# .zip, its blockmap, and latest-mac.yml to GitHub Releases; electron-updater
# (electron/updater.ts) polls latest-mac.yml from that same repo.
publish:
  provider: github
  owner: secondpathstudio
  repo: privatescribe

# Files that go inside the asar (Resources/app/). Renderer + main process.
files:
  - electron/dist/**/*
  - electron/assets/**/*
  - frontend/dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,*.markdown}"

# Lives outside the asar so it can be spawned as a child process. The
# PyInstaller onedir layout (binary + _internal/) is preserved verbatim
# under Resources/backend/, matching what backend-process.ts expects.
extraResources:
  - from: backend/dist/privatescribe-backend
    to: backend
    filter:
      - "**/*"
  # The bundled Ollama runtime (headless ollama-darwin.tgz, staged by
  # scripts/fetch-ollama.mjs). Lands at Resources/ollama-runtime/ — Electron
  # spawns ollama-runtime/ollama on demand when the user opts into the
  # built-in engine during onboarding (see electron/ollama-process.ts).
  - from: build-resources/ollama
    to: ollama-runtime
    filter:
      - "**/*"
  # The pyannote speaker-diarization model weights (staged by
  # scripts/fetch-pyannote.mjs). Lands at Resources/pyannote-models/ — the
  # backend loads diarization from here with no HF token or network when
  # Electron passes PYANNOTE_MODELS_DIR (see electron/backend-process.ts and
  # backend/app/services/diarization.py).
  - from: build-resources/pyannote
    to: pyannote-models
    filter:
      - "**/*"
  # The bundled Caddy web server (static macOS arm64 binary, staged by
  # scripts/fetch-caddy.mjs). Lands at Resources/caddy-runtime/ — in server
  # mode the service layer launches caddy-runtime/caddy to terminate TLS,
  # serve the built SPA, and reverse-proxy /api to the loopback backend
  # (roadmap Phase 9). Signed + notarized by the same mac signing flow as the
  # other bundled binaries.
  - from: build-resources/caddy
    to: caddy-runtime
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  # Overrides Electron's generic default microphone-permission text — this is
  # the description macOS shows in the permission prompt on first recording.
  # extendInfo merges these keys into the generated Info.plist.
  extendInfo:
    NSMicrophoneUsageDescription: "PrivateScribe uses the microphone to record audio for transcription. All audio is processed locally on your device and never uploaded."
  icon: electron/assets/icon.icns
  identity: "Grant Nelson (C3G762929W)"
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  gatekeeperAssess: false
  # Notarization: requires APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # in the environment. Loaded from .env.notarize by the dist script via
  # dotenv-cli. Adds ~3-5 min per build (Apple round-trip).
  notarize: true
  target:
    # dmg is the first-install download; zip is what electron-updater
    # (Squirrel.Mac) applies updates from. Both targets are notarized.
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64

dmg:
  title: PrivateScribe ${version}
  # Branded install window. background is a multi-rep .tiff (540x380 @1x +
  # 1080x760 @2x); window dimensions are in points and match the @1x art.
  background: build-resources/dmg-background.tiff
  window:
    width: 540
    height: 380
  iconSize: 100
  # Icons sit low in the window, in the darker band below the sun artwork,
  # so the white icon labels stay legible.
  contents:
    - x: 130
      y: 250
    - x: 410
      y: 250
      type: link
      path: /Applications
