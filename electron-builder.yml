# electron-builder config for PrivateScribe.
#
# Assumes these have already been built:
#   - frontend/dist/        (npm run build:frontend)
#   - electron/dist/        (npm run build:electron)
#   - backend/dist/privatescribe-backend/  (npm run build:backend, slow)
#   - build-resources/ollama/  (npm run build:ollama — run automatically by `npm run dist`)
#   - build-resources/caddy/   (npm run build:caddy  — run automatically by `npm run dist`)
#
# Run: npm run dist  →  release/PrivateScribe-<ver>.dmg

appId: com.secondpath.privatescribe
productName: PrivateScribe
copyright: Copyright © 2026 Second Path Studio

directories:
  output: release

# Auto-update source. electron-builder publishes the installer, the update
# .zip, its blockmap, and latest-mac.yml to GitHub Releases; electron-updater
# (electron/updater.ts) polls latest-mac.yml from that same repo.
publish:
  provider: github
  owner: secondpathstudio
  repo: privatescribe

# Files that go inside the asar (Resources/app/). Renderer + main process.
files:
  - electron/dist/**/*
  - electron/assets/**/*
  # frontend/dist is NOT in the asar — it ships via extraResources at
  # Resources/frontend (so the external Caddy process can file-serve it in
  # server mode, and standalone loads it from there too). See main.ts.
  - package.json
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,*.markdown}"

# Lives outside the asar so it can be spawned as a child process. The
# PyInstaller onedir layout (binary + _internal/) is preserved verbatim
# under Resources/backend/, matching what backend-process.ts expects.
extraResources:
  - from: backend/dist/privatescribe-backend
    to: backend
    filter:
      - "**/*"
  # The bundled Ollama runtime (headless ollama-darwin.tgz, staged by
  # scripts/fetch-ollama.mjs). Lands at Resources/ollama-runtime/ — Electron
  # spawns ollama-runtime/ollama on demand when the user opts into the
  # built-in engine during onboarding (see electron/ollama-process.ts).
  - from: build-resources/ollama
    to: ollama-runtime
    filter:
      - "**/*"
  # The pyannote speaker-diarization model weights (staged by
  # scripts/fetch-pyannote.mjs). Lands at Resources/pyannote-models/ — the
  # backend loads diarization from here with no HF token or network when
  # Electron passes PYANNOTE_MODELS_DIR (see electron/backend-process.ts and
  # backend/app/services/diarization.py).
  - from: build-resources/pyannote
    to: pyannote-models
    filter:
      - "**/*"
  # Caddy (LAN-facing web server for server mode) + its Caddyfile template.
  # Staged per-OS by scripts/fetch-caddy.mjs; the service layer reads the
  # template from Resources/caddy-runtime/ when installing the server services.
  - from: build-resources/caddy
    to: caddy-runtime
    filter:
      - "**/*"
  - from: build-resources/Caddyfile.template
    to: caddy-runtime/Caddyfile.template
  # A plain (non-asar) copy of the built SPA for Caddy to file-serve in server
  # mode — an external process can't read frontend/dist from inside app.asar.
  # Lands at Resources/frontend/.
  - from: frontend/dist
    to: frontend
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  # Overrides Electron's generic default microphone-permission text — this is
  # the description macOS shows in the permission prompt on first recording.
  # extendInfo merges these keys into the generated Info.plist.
  extendInfo:
    NSMicrophoneUsageDescription: "PrivateScribe uses the microphone to record audio for transcription. All audio is processed locally on your device and never uploaded."
    # macOS Local Network Privacy: without these, a sandboxed/hardened app's
    # Bonjour browse silently returns nothing (the OS gates multicast + local
    # connections per app, and only allowlisted service types are returned).
    # NSBonjourServices must list every type the client browses; the client
    # auto-discovery (electron/main.ts client:discover) browses _privatescribe._tcp.
    NSLocalNetworkUsageDescription: "PrivateScribe looks for PrivateScribe servers on your local network so you can connect to one. Nothing leaves your network."
    NSBonjourServices:
      - _privatescribe._tcp
  icon: electron/assets/icon.icns
  identity: "Grant Nelson (C3G762929W)"
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  gatekeeperAssess: false
  # Notarization: requires APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # in the environment. Loaded from .env.notarize by the dist script via
  # dotenv-cli. Adds ~3-5 min per build (Apple round-trip).
  notarize: true
  target:
    # dmg is the first-install download; zip is what electron-updater
    # (Squirrel.Mac) applies updates from. Both targets are notarized.
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64

win:
  icon: electron/assets/icon.ico
  # Code signing (Authenticode) is a follow-up — without a cert, SmartScreen
  # warns first-time users. When that lands, signtoolOptions.publisherName
  # is where the signing publisher metadata goes.
  target:
    # nsis: the typical Windows installer with uninstaller + Start Menu entry —
    # and what electron-updater consumes for in-place updates. portable: a
    # single .exe with no install for users who don't want to commit.
    - target: nsis
      arch: x64
    - target: portable
      arch: x64

nsis:
  oneClick: false # show a real install wizard, not a silent one-click install
  perMachine: false # per-user install — no UAC prompt during install
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # NOTE: there's no installer-level "publisher" field in electron-builder 26 —
  # the publisher string is set by signtool at signing time. When we add an
  # Authenticode cert, the publisher goes under win.signtoolOptions.publisherName.
  # Until then, Windows will show "Unknown publisher" on first install; expected.

linux:
  # electron-builder accepts a single PNG >=512px and auto-generates the
  # per-size variants AppImage / deb need; our source is 1024x1024.
  icon: electron/assets/icon.png
  # freedesktop main category — primary action is recording + transcribing audio.
  category: AudioVideo
  # TODO: replace with the real publishing email before the first .deb release —
  # deb metadata is what apt shows; "Name <email>" is required by the format.
  maintainer: Second Path Studio <hello@secondpath.dev>
  target:
    # AppImage: single executable, runs on any glibc-based distro, the
    # auto-update channel for Linux. deb: Debian/Ubuntu native package.
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64

dmg:
  title: PrivateScribe ${version}
  # Branded install window. background is a multi-rep .tiff (540x380 @1x +
  # 1080x760 @2x); window dimensions are in points and match the @1x art.
  background: build-resources/dmg-background.tiff
  window:
    width: 540
    height: 380
  iconSize: 100
  # Icons sit low in the window, in the darker band below the sun artwork,
  # so the white icon labels stay legible.
  contents:
    - x: 130
      y: 250
    - x: 410
      y: 250
      type: link
      path: /Applications
