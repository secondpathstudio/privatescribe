# Cross-platform desktop release build (Win/Linux).
#
# Manual-trigger CI matrix that builds installable Windows and Linux desktop
# artifacts and uploads them for inspection. Does NOT publish to GitHub
# Releases yet — first runs are about confirming the cross-platform pipeline
# works end-to-end. Once we have a green run we'll switch `--publish never`
# to `--publish always` and re-enable the tag trigger below.
#
# macOS is intentionally NOT in this matrix. Local `npm run release` already
# produces signed+notarized mac builds against the Developer ID cert installed
# on the maintainer's machine; moving that to CI needs the cert exported as a
# CSC_LINK secret and is a separate follow-up.
#
# Required secret:
#   HF_TOKEN — used by scripts/fetch-pyannote.mjs to download the gated
#              speaker-diarization model weights (set once at GitHub repo
#              level under Settings → Secrets and variables → Actions).
name: Release build (Win/Linux desktop)

on:
  workflow_dispatch:
  # TODO: re-enable once a manual workflow_dispatch run is green AND
  # --publish never is switched to --publish always below.
  # push:
  #   tags: ['v*']

jobs:
  build:
    name: build (${{ matrix.os }})
    # The default GITHUB_TOKEN is read-only unless granted write here; the Linux
    # job needs contents:write to create/upload the GitHub Release.
    permissions:
      contents: write
    timeout-minutes: 75 # heavy installs + per-OS PyInstaller pass + electron-builder
    strategy:
      fail-fast: false # see both OSes' results, not just the first failure
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # one shell across both OSes (bash ships on the win runner)

    steps:
      - uses: actions/checkout@v4

      # The Ubuntu runner ships with only ~14 GB free on /, and our build stacks
      # CPU torch + heavy backend deps + Ollama runtime (~3 GB extracted) +
      # pyannote models + PyInstaller intermediate + electron-builder staging.
      # fpm (the .deb builder) tipped the runner over with ENOSPC last time.
      # Reclaim the ~30 GB of preinstalled tooling we don't need (Android,
      # .NET, Haskell, Docker images, swap). tool-cache:false preserves the
      # /opt/hostedtoolcache slot setup-node/setup-python populate.
      - name: Free disk space on runner (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false # skips slow apt removals; the targeted reclaims are enough
          swap-storage: true
          docker-images: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches backend/venv (cp311) and the spec hidden imports

      # The desktop app is CPU-only. Pre-install CPU torch so the default
      # PyPI wheel on Linux (multi-GB CUDA) never lands; requirements.txt then
      # sees torch/torchaudio already satisfied at the right version.
      - name: Install CPU torch
        run: pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend deps + PyInstaller
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.20.0

      - name: Install Node deps (root)
        run: npm ci

      # The frontend is a separate npm project (frontend/package.json) with its
      # own lockfile; the root `npm ci` doesn't reach into it. Local dev runs
      # `cd frontend && npm install` once and then `npm run dev` from the root.
      - name: Install Node deps (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build frontend (vite)
        run: npm run build:frontend

      - name: Build electron main process (tsc)
        run: npm run build:electron

      # Ollama is no longer bundled — it's fetched at first run into the data dir
      # (see OLLAMA_RUNTIME_FETCH_SPEC.md), which keeps installers under GitHub's
      # 2 GiB Release-asset cap. So there is no "Stage Ollama" step here.
      - name: Stage Caddy web server (per-OS archive)
        run: npm run build:caddy

      # WinSW wraps the server-mode processes as Windows Services — Windows-only,
      # so it runs only on the Windows runner (the script no-ops elsewhere).
      - name: Stage WinSW service wrapper (Windows)
        if: runner.os == 'Windows'
        run: npm run build:winsw

      - name: Stage pyannote diarization models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIVATESCRIBE_PYTHON: python
        run: npm run build:pyannote

      # Real PyInstaller spec — same one local builds use. The `build:backend`
      # npm script activates backend/venv which doesn't exist on CI, so invoke
      # pyinstaller directly against the interpreter setup-python provisioned.
      - name: Build backend (PyInstaller, real spec)
        working-directory: backend
        run: pyinstaller --noconfirm --log-level WARN privatescribe-backend.spec

      # --publish never while the runtime-fetch work lands: publishing now would
      # ship a release whose app can't find an engine until fetch-on-first-run is
      # complete (OLLAMA_RUNTIME_FETCH_SPEC.md slice 6 re-enables --publish always).
      # Build the installer and upload it as an artifact for device-testing.
      - name: Package desktop installer (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      # --publish never: Windows isn't confirmed yet — produce the installer on
      # the runner and upload it as an artifact for download + smoke-test only.
      # Switch to --publish always once a Windows run is green and trusted.
      - name: Package desktop installer (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      # The release/ dir is where electron-builder writes its outputs (see
      # `directories.output: release` in electron-builder.yml). We pull only
      # the installables + the auto-update channel YAMLs — skipping unpacked
      # app dirs, blockmaps, and the heavy intermediate "win-unpacked" tree.
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privatescribe-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14
