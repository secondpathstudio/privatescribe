# Throwaway de-risk probe for the Windows/Linux desktop build.
#
# Proves sqlcipher3-wheels (the encrypted-DB dependency, the one piece that
# needs a system library on dev machines via `brew install sqlcipher`) installs
# from a prebuilt wheel AND survives PyInstaller freezing on every OS in the
# release matrix — i.e. the frozen backend can open a keyed SQLCipher database
# with no system SQLCipher present.
#
# Trigger from the Actions tab (workflow_dispatch) or by pushing this file.
# Delete derisk/ and this workflow once the real matrix build is green.
name: De-risk SQLCipher (Win/Linux/macOS)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/derisk-sqlcipher.yml"
      - "derisk/sqlcipher_probe.py"

jobs:
  sqlcipher:
    name: sqlcipher freeze (${{ matrix.os }})
    strategy:
      fail-fast: false # see every OS's result, not just the first failure
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches backend/venv (cp311)

      # No compiler, no system SQLCipher — must resolve to a prebuilt wheel.
      - name: Install sqlcipher3-wheels + PyInstaller
        run: pip install sqlcipher3-wheels==0.5.7 pyinstaller==6.20.0

      - name: Round-trip a keyed DB (plain import)
        run: python derisk/sqlcipher_probe.py

      - name: Freeze with PyInstaller
        run: >
          pyinstaller --onedir --noconfirm --log-level WARN
          --name sqlcipher-probe
          --hidden-import sqlcipher3 --hidden-import sqlcipher3.dbapi2
          derisk/sqlcipher_probe.py

      - name: Run the frozen binary (Unix)
        if: runner.os != 'Windows'
        run: ./dist/sqlcipher-probe/sqlcipher-probe

      - name: Run the frozen binary (Windows)
        if: runner.os == 'Windows'
        run: .\dist\sqlcipher-probe\sqlcipher-probe.exe
