# Throwaway de-risk probe for scripts/fetch-ollama.mjs (Phase 1 change #2).
#
# Runs the REAL fetch script on Linux + Windows and asserts the Ollama binary
# landed at the staged-runtime root. This exercises the three platform-specific
# bits that can't be checked on a mac: zstd extraction (Linux .tar.zst), bsdtar
# zip extraction (Windows), and the assumption that the Windows zip places
# ollama.exe at the archive root (Linux + macOS roots are already confirmed).
#
# Heads-up: each job downloads Ollama's full runtime (~1.1 GB Linux, ~2 GB
# Windows — GPU backends included, kept on purpose), so it's not fast.
#
# Trigger from the Actions tab or by pushing this file. Delete once Phase 1
# is settled.
name: De-risk fetch-ollama (Win/Linux)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/derisk-fetch-ollama.yml"
      - "scripts/fetch-ollama.mjs"

jobs:
  fetch-ollama:
    name: fetch-ollama (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # one shell across both OSes (bash ships on the win runner)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # zstd is preinstalled on ubuntu runners; assert it so a missing tool is
      # an obvious failure rather than a confusing tar error.
      - name: Verify zstd present (Linux)
        if: runner.os == 'Linux'
        run: zstd --version

      - name: Stage the Ollama runtime for this OS
        run: node scripts/fetch-ollama.mjs

      - name: Assert the binary landed at the runtime root
        run: |
          bin="build-resources/ollama/ollama"
          [ "${{ runner.os }}" = "Windows" ] && bin="build-resources/ollama/ollama.exe"
          echo "--- staged root entries ---"
          ls -la build-resources/ollama/ | head -20
          test -f "$bin" || { echo "FAIL: $bin not found at root"; exit 1; }
          echo "OK: staged $bin"
          cat build-resources/ollama/.ollama-version
